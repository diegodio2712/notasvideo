.meta{color:var(--muted);font-size:14px}

.sec{margin-top:28px}
.lost{margin:0;padding:0;list-style:none}

const $=s=>document.querySelector(s);
const num=s=>parseFloat(String(s).replace(',','.'));
const fmt=n=>n.toFixed(1).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tSel=$('#turma'),fSel=$('#fis'),out=$('#out');
[...new Set(D.map(x=>x.t))].sort().forEach(t=>tSel.add(new Option(t,t)));
tSel.onchange=()=>{
  fSel.innerHTML='';
  if(!tSel.value){fSel.disabled=true;fSel.add(new Option('Escolha a turma primeiro',''));show(null);return}
  fSel.disabled=false;fSel.add(new Option('Selecione…',''));
  D.map((x,i)=>[x,i]).filter(([x])=>x.t===tSel.value).sort((a,b)=>a[0].f.localeCompare(b[0].f,'pt'))
   .forEach(([x,i])=>fSel.add(new Option(x.f,i)));
  show(null);
};
fSel.onchange=()=>show(fSel.value===''?null:D[+fSel.value]);
let na=false,x=null;function pill(c){
  if(na&&!(x.st==='link'&&/^Publica/i.test(c.n)))return['pend','—'];
  const v=num(c.nota),m=num(c.max);
  return [v>=m?'full':v>0?'part':'zero',`${c.nota} / ${c.max.replace(/^(\d)$/,'$1,0')}`];
}
function show(cur){x=cur;
  if(!x){out.innerHTML='<div class="empty">Selecione a turma e o físico para ver sua avaliação.</div>';return}
  na=x.st==='inacessivel'||x.st==='link';const pend=na;
  const fin=num(x.fin);
  let h=`<div class="score"><div><div class="big">${pend?'—':x.fin}<small> / 2,0</small></div>
    ${pend?'':`<div class="bar"><i style="width:${fin/2*100}%"></i></div>`}</div>
    <div class="meta"><b>${esc(x.f)}</b> · Turma ${esc(x.t)}<br>${na?'Não avaliado':`${x.tot} de 20 pontos`}<br>Enviado em ${esc(x.env)}${x.dur&&x.dur!=='desconhecida'?` · Duração: ${esc(x.dur)}`:''}</div></div>`;
  if(x.msg)h+=`<div class="alert bad">${x.msg}</div>`;
  if(x.com)h+=`<div class="com"><h3>Comentário do professor</h3><p>${esc(x.com)}</p></div>`;
  if(!na){
    const lost=x.c.filter(c=>!c.nota.startsWith('—')&&num(c.nota)<num(c.max));
    h+=`<div class="sec"><h2>Onde você perdeu pontos</h2>`;
    h+=lost.length?`<ul class="lost">${lost.map(c=>`<li><span class="minus">−${fmt(num(c.max)-num(c.nota))}</span><span><b>${esc(c.n)}:</b> ${esc(c.j||(c.opts.find(o=>o[2])||['',''])[1])}</span></li>`).join('')}</ul>`
      :`<p>Nenhum ponto perdido — nota máxima! 🎉</p>`;
    h+=`</div>`;
  }
  h+=`<div class="sec"><h2>Avaliação item por item</h2>`;
  x.c.forEach(c=>{
    const [cls,lab]=pill(c);
    const open=cls==='part'||cls==='zero'?' open':'';
    h+=`<details class="crit"${na?'':open}><summary><span>${esc(c.n)}</span><span class="pill ${cls}">${lab}</span></summary><div class="body">
      ${c.j&&cls!=='pend'?`<p class="why">${esc(c.j)}</p>`:cls==='pend'?`<p class="why">Não avaliado: ${x.st==='link'?'link inválido':'vídeo inacessível'}.</p>`:''}
      <ul class="opts">${c.opts.map(o=>`<li class="${o[2]?'sel':''}"><b>${o[0]}</b><span>${esc(o[1])}</span></li>`).join('')}</ul></div></details>`;
  });
  out.innerHTML=h+'</div>';
}
